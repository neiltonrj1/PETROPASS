# Publica o PETROPASS no GitHub Pages.
#
# O site é só o punhado de arquivos listados em "Separar o que vai ao ar":
# index.html (gerado pelo build), config.js, sw.js, o manifesto e os ícones.
# O código-fonte em src/ e as ferramentas ficam no repositório, mas não são
# publicados — não há por que servir 60 arquivos que ninguém baixa.
name: Publicar no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar o Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar as dependências
        run: npm ci || npm install

      - name: Refazer o index.html a partir de src/
        run: npm run build

      - name: Conferir se o app abre sem erro
        run: node ferramentas/testar.mjs

      - name: Instalar o Chrome (para o teste de clique)
        uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: Conferir se os botões respondem ao clique
        run: node ferramentas/testar-clique.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Separar o que vai ao ar
        run: |
          mkdir -p _site
          cp index.html config.js sw.js manifest.webmanifest icon-192.png icon-512.png _site/
          # As figuras das questões são arquivos, não vão embutidas no
          # index.html (dobrariam o tamanho dele). Sem esta cópia elas
          # aparecem quebradas no app, mesmo estando no repositório.
          if [ -d figuras ]; then cp -r figuras _site/; fi

      - name: Conferir se as figuras foram junto
        run: |
          esperadas=$(ls figuras/*.png 2>/dev/null | wc -l)
          foram=$(ls _site/figuras/*.png 2>/dev/null | wc -l)
          echo "figuras no repositório: $esperadas · no site: $foram"
          if [ "$esperadas" != "$foram" ]; then
            echo "::error::as figuras não foram para o _site — apareceriam quebradas no app"
            exit 1
          fi

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Enviar os arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
